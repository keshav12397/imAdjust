[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imAdjust"
version = "0.1.0"
description = "A small package to deal with .nd2 files from the slide scanner"
authors = [{name = "Keshav B. Suresh"},{name = "Logan Thomas"},{name = "Claude"}]
requires-python = ">=3.8"
dependencies = ["nd2", "opencv-python", "scipy","numpy","pandas","matplotlib","tqdm"]
readme = "README.md"


[project.scripts]
imadjust = "imAdjust.nd2fxns:main"

[tool.setuptools.packages.find]
where = ["src"]